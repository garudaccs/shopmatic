<svg width="640" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.05)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" rx="16"/>
  <rect width="640" height="400" fill="url(#sheen)" rx="16"/>
  <!-- Decorative circles -->
  <circle cx="520" cy="80" r="120" fill="rgba(255,255,255,0.08)"/>
  <circle cx="560" cy="320" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="350" r="60" fill="rgba(255,255,255,0.05)"/>
  <!-- Text -->
  <text x="320" y="180" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="700" fill="white">Replit</text>
  <rect x="220" y="210" width="200" height="1" fill="rgba(255,255,255,0.3)"/>
  <text x="320" y="250" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.85)">Cloud IDE</text>
  <!-- Badge -->
  <rect x="240" y="290" width="160" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="320" y="313" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="white">SHOPMATIC REVIEW</text>
</svg>